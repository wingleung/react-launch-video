name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push that supersedes a running job cancels it rather than queueing behind it. Never on main, where every
# commit's result is worth having.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole suite is minutes. A run that reaches this has hung, and a hung run holds the queue for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evals/fixtures/relay-web/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Pinned. `claude plugin validate --strict` is a gate here, so an unpinned install means a CLI release can
      # redden a commit that changed nothing. Bump this deliberately.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.278

      # One step on purpose. This used to be a copy of scripts/check.sh with a step per check, and the two drifted
      # the first time a gate was added to one and not the other, which is exactly the failure a copy always has.
      # check.sh prints its own headers, so the log still says which check failed.
      - name: Checks
        run: ./scripts/check.sh
