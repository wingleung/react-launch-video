name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evals/fixtures/relay-web/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # One step on purpose. This used to be a copy of scripts/check.sh with a step per check, and the two drifted
      # the first time a gate was added to one and not the other, which is exactly the failure a copy always has.
      # check.sh prints its own headers, so the log still says which check failed.
      - name: Checks
        run: ./scripts/check.sh
