name: Pages

# The site reads the manifest, the README, the skills and the reels in docs/ at build time, so any of them changing
# means the published page is stale.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - plugin/**
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a running one is allowed to finish: cancelling mid-deploy can leave Pages half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the job that publishes can publish.
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
